{% extends "base.html" %}

{% block title %}Login - Campus Energy Oracle{% endblock %}

{% block body %}
<div class="login-page">
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <i class="fas fa-leaf"></i>
                <h2>Campus Energy Oracle</h2>
                <p>Sign in to continue</p>
            </div>
            
            <form method="POST" action="{{ url_for('login') }}" class="login-form">
                <div class="form-group">
                    <label for="user_type">Login As</label>
                    <select id="user_type" name="user_type" class="form-control" required>
                        <option value="student">Student</option>
                        <option value="facility">Facility Manager</option>
                        <option value="admin">Administrator</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" class="form-control" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-control" required>
                </div>
                
                <button type="submit" class="btn btn-primary btn-block">
                    Login <i class="fas fa-sign-in-alt"></i>
                </button>
            </form>
            
            <div class="login-footer">
                <a href="#">Forgot password?</a>
                <span>•</span>
                <a href="{{ url_for('index') }}">Back to home</a>
            </div>
        </div>
        
        <div class="login-demo-credentials">
            <h4>Demo Credentials</h4>
            <div class="demo-cred">
                <strong>Student:</strong> student / password
            </div>
            <div class="demo-cred">
                <strong>Facility:</strong> facility / password
            </div>
            <div class="demo-cred">
                <strong>Admin:</strong> admin / password
            </div>
        </div>
    </div>
</div>
{% endblock %}
